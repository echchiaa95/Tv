<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شاشة العرض — TV Display</title>
<meta name="theme-color" content="#0B1F1C" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🖥️</text></svg>" />
<!--
  ============================================================
  tv.html — شاشة العرض المستقلة (ملف خفيف للتلفاز)
  ============================================================
  التشغيل:
    1) ارفع هذا الملف على نطاق التلفاز (مثل tv.elbordji.com) كـ index.html
       أو افتحه مباشرة:  tv.html
    2) ستظهر QR ورمز شاشة — امسحها من تطبيق المتجر:
       تبويب «🖥️ شاشات العرض» ← «📷 مسح QR الشاشة»
    3) اضغط «📡 نشر» في التطبيق — يصل المحتوى خلال ثوانٍ.

  تثبيت رمز شاشة دائم (اختياري):
       tv.html?screen=YOURCODE
  ثم في التطبيق أضف نفس الرمز يدويًا (زر «＋ إضافة برمز يدوي»).

  يتطلب نفس إعداد Supabase للمتجر (نفس المشروع + جدول tv_screens).
-->
<style>
:root {
  --bg: #0B1F1C; --card: #132E29; --card-2: #17362F;
  --text: #EAF2EF; --muted: #8FA8A2; --mint: #3ECF8E; --amber: #F2A65A; --red: #E85D5D; --border: #1E4038;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; color: var(--text); user-select: none; cursor: none; }
button { font-family: inherit; cursor: pointer; }

#tvRoot { position: fixed; inset: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 0%, #123a32 0%, var(--bg) 70%); overflow: hidden; }

.tv-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 28px; border-bottom: 1px solid var(--border); background: rgba(11,31,28,.85); }
.tv-store { font-size: 26px; font-weight: 800; color: var(--mint); }
.tv-clock { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--amber); font-weight: 700; direction: ltr; }
.tv-badge { font-size: 13px; padding: 4px 14px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border); color: var(--muted); }
.tv-badge.on { color: var(--mint); border-color: var(--mint); }

.tv-body { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; justify-content: center; overflow: hidden; }

/* شبكة المنتجات */
.tv-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; padding: 26px 30px; width: 100%; align-content: start; }
.tv-prod { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; animation: tvFade .5s ease; }
.tv-prod-img { height: 130px; display: flex; align-items: center; justify-content: center; }
.tv-prod-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.tv-prod-init { height: 130px; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: var(--mint); opacity: .5; }
.tv-prod-name { font-size: 19px; font-weight: 700; min-height: 2.6em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tv-prod-price { font-size: 24px; font-weight: 800; color: var(--mint); }

/* شرائح الإعلانات */
.tv-ads-slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px; text-align: center; animation: tvFade .6s ease; }
.tv-ads-slide img { max-width: 52vw; max-height: 46vh; object-fit: contain; border-radius: 18px; }
.tv-ad-title { font-size: 54px; font-weight: 800; color: var(--mint); }
.tv-ad-text { font-size: 28px; max-width: 70vw; line-height: 1.7; }

/* شاشة الانتظار + QR */
.tv-waiting { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.tv-waiting h2 { font-size: 32px; color: var(--mint); }
.tv-code-big { font-size: 60px; font-weight: 800; letter-spacing: 10px; color: var(--amber); direction: ltr; }
.tv-qr { background: #fff; padding: 14px; border-radius: 16px; line-height: 0; }
.tv-qr img, .tv-qr canvas { display: block; width: 230px !important; height: 230px !important; }
.tv-waiting p { font-size: 18px; color: var(--muted); max-width: 640px; line-height: 1.9; }
.tv-waiting .tv-qr-url { direction: ltr; font-size: 14px; }
.tv-error { color: var(--red); font-size: 16px; }
.tv-empty-msg { align-self: center; font-size: 24px; color: var(--muted); }

.tv-footer-ticker { flex: 0 0 auto; border-top: 1px solid var(--border); background: rgba(19,46,41,.9); padding: 10px 28px; font-size: 17px; color: var(--amber); white-space: nowrap; overflow: hidden; }

/* لوحة طلبات المقهى/المطعم */
.tv-orders { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 18px 24px; min-height: 0; }
.tv-ord-col { display: flex; flex-direction: column; min-height: 0; background: rgba(19,46,41,.45); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.tv-ord-col-head { padding: 12px 16px; font-size: 21px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.tv-ord-col-head.tv-ord-new { color: var(--amber); }
.tv-ord-col-head.tv-ord-prep { color: #7CC4FF; }
.tv-ord-col-head.tv-ord-ready { color: var(--mint); }
.tv-ord-n { background: var(--card-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 12px; font-size: 15px; color: var(--text); }
.tv-ord-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tv-ord-card { background: var(--card); border: 1px solid var(--border); border-inline-start: 5px solid var(--mint); border-radius: 12px; padding: 12px 14px; animation: tvFade .4s ease; }
.tv-ord-card.tv-ord-late { border-inline-start-color: var(--red); }
.tv-ord-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.tv-ord-num { font-size: 19px; color: var(--mint); direction: ltr; }
.tv-ord-meta { font-size: 13.5px; color: var(--muted); }
.tv-ord-items { margin: 0; padding-inline-start: 18px; font-size: 17px; line-height: 1.75; }
.tv-ord-items b { color: var(--amber); }
.tv-ord-total { margin-top: 8px; font-size: 16px; font-weight: 800; color: var(--mint); border-top: 1px dashed var(--border); padding-top: 6px; }
.tv-ord-empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 16px; }
@media (max-width: 900px) {
  .tv-orders { grid-template-columns: 1fr; overflow-y: auto; }
  .tv-ord-col { min-height: 180px; }
  .tv-ord-col-head { font-size: 17px; }
  .tv-ord-items { font-size: 15px; }
}

@keyframes tvFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 900px) {
  .tv-ads-slide .tv-ad-title { font-size: 34px; }
  .tv-ads-slide .tv-ad-text { font-size: 20px; }
  .tv-store { font-size: 20px; } .tv-clock { font-size: 17px; }
  .tv-products { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 14px; }
  .tv-prod-name { font-size: 15px; } .tv-prod-price { font-size: 19px; }
  .tv-prod-img, .tv-prod-init { height: 90px; }
  .tv-code-big { font-size: 40px; }
}
</style>
</head>
<body>
<div id="tvRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
/* ============================================================
 * tv.html — منطق شاشة العرض (مستقل)
 * نفس مفتاح Supabase العام للمتجر — القراءة فقط بـ RLS.
 * ============================================================ */
"use strict";

const SUPABASE_URL = "https://lcijdjihkzenabhnlhxl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1k9usfmeGl3-n1amoH9eIw_zT01B00r";

const PAGE_SIZE = 12;
const POLL_MS = 6000;

let sbClient = null;
let code = "";
let current = null;
let pageIdx = 0, modeIdx = 0;
let lastSig = "";
let rotTimer = null, pollTimer = null, clockTimer = null;

/* ---------- أدوات ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]);
  });
}
function genCode() {
  const abc = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let out = "";
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  for (let i = 0; i < 8; i++) out += abc[arr[i] % abc.length];
  return out;
}
function fmtMoney(n, cur) {
  const suffix = cur === "SAR" ? " ريال" : " د.م";
  return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString("ar-MA") + suffix;
}
function tick() {
  const c = document.getElementById("tvClock");
  if (c) c.textContent = new Date().toLocaleTimeString("ar-MA", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function setStatus(on, txt) {
  const b = document.getElementById("tvStatus");
  if (b) { b.classList.toggle("on", !!on); b.textContent = txt; }
}
function headerHtml() {
  return '<div class="tv-header">' +
    '<span class="tv-store" id="tvStoreName">' + (current && current.storeName ? esc(current.storeName) : "شاشة العرض") + "</span>" +
    '<span><span class="tv-badge" id="tvStatus">بانتظار الربط…</span></span>' +
    '<span class="tv-clock" id="tvClock"></span></div>';
}

/* ---------- الاتصال بـ Supabase ---------- */
function initSb() {
  try {
    if (!window.supabase || typeof window.supabase.createClient !== "function") return false;
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
    });
    return true;
  } catch (e) {
    sbClient = null;
    return false;
  }
}
async function fetchRemote(scrCode) {
  if (!sbClient) return { success: false, message: "no-supabase-lib" };
  try {
    const r = await sbClient.from("tv_screens").select("payload,updated_at").eq("code", scrCode).maybeSingle();
    if (r.error) {
      const msg = (r.error.code === "PGRST205") ? "جدول tv_screens غير موجود — نفّذ أوامر SQL في ملف المتجر" : (r.error.message || "خطأ");
      return { success: false, message: msg };
    }
    return { success: true, payload: r.data ? r.data.payload : null, updatedAt: r.data ? r.data.updated_at : null };
  } catch (e) {
    return { success: false, message: e && e.message ? e.message : "network" };
  }
}

/* ---------- العرض ---------- */
function renderWaiting(errMsg) {
  document.getElementById("tvRoot").innerHTML = headerHtml() +
    '<div class="tv-body"><div class="tv-waiting">' +
    "<h2>🖥️ ربط شاشة العرض</h2>" +
    '<div class="tv-code-big">' + code + "</div>" +
    '<div class="tv-qr" id="tvQrBox"></div>' +
    "<p>من هاتف المتجر: تبويب «🖥️ شاشات العرض» ← «📷 مسح QR الشاشة» ثم اضغط «📡 نشر».</p>" +
    '<p class="tv-qr-url">' + esc(location.origin === "null" || location.protocol === "file:" ? "tv.html?screen=" + code : location.origin + location.pathname + "?screen=" + code) + "</p>" +
    (errMsg ? '<p class="tv-error">' + esc(errMsg) + "</p>" : "") +
    "</div></div>";
  setStatus(false, "بانتظار الربط — " + code);
  try {
    if (typeof QRCode !== "undefined") {
      new QRCode(document.getElementById("tvQrBox"), { text: "tvcode://PAIR/" + code, width: 230, height: 230, correctLevel: QRCode.CorrectLevel.M });
    } else {
      const q = document.getElementById("tvQrBox");
      if (q) q.innerHTML = '<div style="color:#111; font-weight:800; font-size:22px; padding:18px;">' + code + "</div>";
    }
  } catch (e) { /* تجاهل */ }
}

function pagesOf(list) {
  const pages = [];
  for (let i = 0; i < list.length; i += PAGE_SIZE) pages.push(list.slice(i, i + PAGE_SIZE));
  return pages.length ? pages : [[]];
}
function renderProductsPage(prods) {
  const cur = (current && current.currency) || "MAD";
  return '<div class="tv-products">' + prods.map(function (p) {
    const media = p.image
      ? '<div class="tv-prod-img"><img src="' + p.image + '" alt=""></div>'
      : '<div class="tv-prod-init">' + esc(String(p.name || "؟").trim().charAt(0)) + "</div>";
    return '<div class="tv-prod">' + media +
      '<div class="tv-prod-name">' + esc(p.name) + "</div>" +
      '<div class="tv-prod-price">' + fmtMoney(p.price, cur) + "</div></div>";
  }).join("") + "</div>";
}
function renderAdSlide(ad) {
  return '<div class="tv-ads-slide">' +
    (ad.image ? '<img src="' + ad.image + '" alt="">' : "") +
    '<div class="tv-ad-title">' + esc(ad.title || "") + "</div>" +
    (ad.text ? '<div class="tv-ad-text">' + esc(ad.text) + "</div>" : "") +
    "</div>";
}
const elapsedMin = function (iso) {
  if (!iso) return 0;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.max(0, Math.round(ms / 60000));
};
const ORD_COLS = [
  { key: "CONFIRMED", label: "🆕 جديد", cls: "tv-ord-new" },
  { key: "PREPARING", label: "🍳 قيد التحضير", cls: "tv-ord-prep" },
  { key: "READY", label: "✅ جاهز", cls: "tv-ord-ready" },
];
function renderOrdersBoard(orders) {
  const cur = (current && current.currency) || "MAD";
  return '<div class="tv-orders">' + ORD_COLS.map(function (col) {
    const list = orders.filter(function (o) { return o.status === col.key; });
    return '<div class="tv-ord-col"><div class="tv-ord-col-head ' + col.cls + '">' + col.label + ' <span class="tv-ord-n">' + list.length + "</span></div>" +
      '<div class="tv-ord-list">' + (list.length ? list.map(function (o) {
        const mins = elapsedMin(o.createdAt);
        const late = mins >= 15 ? " tv-ord-late" : "";
        return '<div class="tv-ord-card' + late + '">' +
          '<div class="tv-ord-top"><b class="tv-ord-num">' + (o.qr ? "📱 " : "") + esc(o.number) + "</b>" +
          '<span class="tv-ord-meta">' + (o.table ? esc(o.table) + " • " : "") + (o.type === "DINE_IN" ? "صالة" : o.type === "TAKEAWAY" ? "خارجي" : "توصيل") + " • " + mins + " د</span></div>" +
          '<ul class="tv-ord-items">' + o.items.map(function (it) { return "<li><b>" + it.qty + "×</b> " + esc(it.name) + "</li>"; }).join("") + "</ul>" +
          (o.total ? '<div class="tv-ord-total">' + fmtMoney(o.total, cur) + "</div>" : "") +
          "</div>";
      }).join("") : '<div class="tv-ord-empty">لا طلبات</div>') + "</div></div>";
  }).join("") + "</div>";
}
function renderContent() {
  clearTimeout(rotTimer);
  if (!current) { renderWaiting(); return; }
  const prods = (current.products || []).filter(function (p) { return (Number(p.price) || 0) >= 0; });
  const ads = current.ads || [];
  const mode = current.mode || "products";
  const orders = current.orders || [];
  const showOrders = mode === "orders";
  const showAds = !showOrders && (mode === "ads" || mode === "alternate") && ads.length > 0 && (mode === "ads" || modeIdx % 2 === 1);
  let bodyHtml;
  if (showOrders) {
    bodyHtml = orders.length ? renderOrdersBoard(orders)
      : '<div class="tv-waiting"><div class="tv-empty-msg">لا توجد طلبات مفتوحة حاليًا — بانتظار الطلبات…</div></div>';
  } else if (showAds) {
    bodyHtml = renderAdSlide(ads[pageIdx % ads.length]);
  } else if (prods.length) {
    const pages = pagesOf(prods);
    bodyHtml = renderProductsPage(pages[pageIdx % pages.length]);
  } else {
    bodyHtml = '<div class="tv-waiting"><div class="tv-empty-msg">لا توجد منتجات للعرض — أضف منتجات ثم انشر من جهاز المتجر.</div></div>';
  }
  const ticker = (current.storePhone ? "📞 " + esc(current.storePhone) + "   •   " : "") + "شاشة " + code + "   •   " + esc(current.storeName || "");
  document.getElementById("tvRoot").innerHTML = headerHtml() +
    '<div class="tv-body">' + bodyHtml + "</div>" +
    '<div class="tv-footer-ticker">' + ticker + "</div>";
  setStatus(true, "متصلة — محدّثة " + (current.updatedAt ? new Date(current.updatedAt).toLocaleTimeString("ar-MA") : ""));
  const maxPages = showAds ? ads.length : Math.max(1, pagesOf(prods).length);
  rotTimer = setTimeout(function () {
    pageIdx++;
    if (mode === "alternate" && maxPages > 0 && pageIdx % Math.max(1, maxPages) === 0) { modeIdx++; pageIdx = 0; }
    renderContent();
  }, showOrders ? 5000 : (showAds ? 8000 : 10000));
}

async function poll() {
  const r = await fetchRemote(code);
  if (r.success && r.payload) {
    const sig = JSON.stringify(r.payload);
    if (sig !== lastSig) { lastSig = sig; current = r.payload; pageIdx = 0; renderContent(); }
    else setStatus(true, "متصلة");
  } else if (!current) {
    renderWaiting(
      r.message === "no-supabase-lib" ? "مكتبة Supabase لم تُحمّل (تحقق من الإنترنت)." :
      (r.message && r.message !== "network" ? r.message : null)
    );
  }
}

/* ---------- الإقلاع ---------- */
(function boot() {
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = new URLSearchParams(); }
  code = String(params.get("screen") || genCode()).toUpperCase().replace(/[^A-Z0-9]/g, "") || genCode();
  initSb();
  renderWaiting();
  tick();
  clockTimer = setInterval(tick, 1000);
  poll();
  pollTimer = setInterval(poll, POLL_MS);
  // ملء الشاشة بنقرة مزدوجة (لأجهزة التلفاز)
  document.addEventListener("dblclick", function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } catch (e) { /* تجاهل */ }
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
